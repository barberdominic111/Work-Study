const TOOLSEQ=[['Get tool',['A','B','G']],['Put tool',['A','B','P']],['Tool action',['T']],['Aside',['A','B','P']],['Return',['A']]];
const PH={'General Move':[['Get',['A','B','G']],['Put',['A','B','P']],['Return',['A']]],'Controlled Move':[['Get',['A','B','G']],['Move',['M','X','I']],['Return',['A']]],'Tool Use':TOOLSEQ,'Equipment Use':TOOLSEQ};

const kwMatch=(kw,q)=>{q=q.trim().toLowerCase().replace(/^#/,'');if(!q)return true;const w=q.includes('*'),re=new RegExp((w?'^':'')+q.split('*').map(x=>x.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')+(w?'$':''),'i');return (kw||[]).some(k=>re.test(k))};

// Basic MOST: index sum x 10 TMU, 1 TMU = 0.036 s. Transparent estimate only, not certified MOST.
const fq=v=>num(v)||1;
function mostCalc(e){let ph;
 if(e.mostDetail){const md=e.md||{};ph=(PH[e.move]||PH['General Move']).map(([n,ls],i)=>[n,ls.reduce((a,L)=>{const k=e.move+':'+i+L;return a+(num(md[k])||0)*fq(md[k+'f'])},0)])}
 else ph=[['Get',(num(e.get)||0)*fq(e.getF)],['Put',(num(e.put)||0)*fq(e.putF)],['Return',(num(e.ret)||0)*fq(e.retF)]];
 const adj=num(e.mostAdj)||0,idx=Math.max(0,ph.reduce((a,x)=>a+x[1],0)+adj),tmu=idx*10;return{ph,adj,idx,tmu,s:idx>0?tmu*0.036:null}}
const mostT=e=>e.mostOn?mostCalc(e).s:null;
const srcT=e=>({MOST:mostT(e),'Time Study':num(e.obsT),Estimate:num(e.estT),'Historical Observed':num(e.histT),Manual:num(e.manT)});
const stdT=e=>srcT(e)[e.source];
const obsT=e=>num(e.obsT)??num(e.histT);
const variance=e=>{const s=stdT(e),o=obsT(e);return s>0&&o!=null?{v:o-s,p:(o-s)/s*100}:null};
const norm=e=>{const s=stdT(e),d=num(e.unitsPer)||FREQ[e.frequency];return s==null||!d?null:s/d};
function seqCalc(s,E){const r={tot:0,va:0,nn:0,nva:0,unk:0,cond:0,cont:0,skip:0,simul:0};
 s.items.map(id=>E.find(x=>x.id===id)).filter(e=>e&&e.active).forEach(e=>{const n=norm(e);if(n==null){r.skip++;return}if(e.simul){r.simul+=n;return}
  if(e.cond==='Conditional'||e.value==='Conditional')r.cond+=n;else{r.tot+=n;r[KV[e.value]]+=n}
  if(e.cont)r.cont+=n});
 const v=num(s.vol);r.lab=v?r.tot*v/3600:null;r.conth=v?r.cont*v/3600:null;return r}
const contRows=(S,E)=>{const o=[];S.forEach(s=>s.items.forEach(id=>{const e=E.find(x=>x.id===id);if(e&&e.active&&e.cont){const n=norm(e),v=num(s.vol);o.push({e,s,n,v,h:n!=null&&v&&!e.simul?n*v/3600:null})}}));return o.sort((a,b)=>(b.h||0)-(a.h||0))};

 return{theme:'light',els,procs:[{id:'PR-0001',name:'Final Assembly',dept:'Assembly',area:'Cell 1',product:'Housing Assy A',desc:'Final assembly cell',ops:1,avail:27000,takt:45,notes:''}],

// ---- small UI ----

 const startAn=sec=>{setPick({mode:'an',sec,sel:[...(an[sec]||[])]});go('el')};const clearAn=sec=>setAn(a=>({...a,[sec]:[]}));
 const doneAn=()=>{setAn(a=>({...a,[pick.sec]:pick.sel}));setPick(null);go('an')};
 const cancelPick=()=>{const m=pick;setPick(null);m.mode==='an'?go('an'):m.mode==='port'?go('port',m.portId):go('seq',m.seqId)};
 const tg=id=>setPick(p=>({...p,sel:p.sel.includes(id)?p.sel.filter(x=>x!==id):[...p.sel,id]}));
 const tga=ids=>setPick(p=>({...p,sel:ids?[...p.sel,...ids.filter(x=>!p.sel.includes(x))]:[]}));
 const donePick=()=>{const{seqId,sel}=pick;if(sel.length)setD(d=>log('Added '+sel.length+' element(s) to '+seqId,{...d,seqs:d.seqs.map(s=>s.id===seqId?{...s,items:[...s.items,...sel.filter(x=>!s.items.includes(x))]}:s)}));setPick(null);go('seq',seqId)};
 const{t,id}=nav;const at=t==='el'&&nav.from==='lib'?'lib':t==='xchg'?'set':t;const pt=D.ports.find(x=>x.id===id),ppk=pick&&pick.mode==='port'?pick:null,pPort=ppk&&D.ports.find(x=>x.id===ppk.portId),inP=pid=>!!(pPort&&pPort.items.some(i=>i.k==='proc'&&i.pid===pid));const el=D.els.find(x=>x.id===id),sq=D.seqs.find(x=>x.id===id),pr=D.procs.find(x=>x.id===id);let body;
 if(t==='home')body=html`<${Home} D=${D} go=${go} setD=${setD}/>`;
 else if(t==='el')body=el?html`<${ElDetail} e=${el} D=${D} set=${setE} go=${go} dup=${dup} del=${delEl} back=${nav.from||'el'} openCard=${()=>setCardOpen(true)}/>`:html`<${Elements} D=${D} go=${go} add=${addEl} openCard=${()=>setCardOpen(true)} pk=${pick&&pick.mode!=='port'?pick:null} tg=${tg} tga=${tga}/>`;
 else if(t==='lib')body=html`<${Elements} D=${D} go=${go} add=${addGen} lib=${true} openCard=${()=>setCardOpen(true)} pk=${pick&&pick.mode!=='port'?pick:null} tg=${tg} tga=${tga}/>`;
 else if(t==='seq')body=sq?html`<${SeqDetail} s=${sq} D=${D} setS=${setS} go=${go} addEl=${sid=>mkEl({},sid)} dupS=${dupS} delS=${delS} startPick=${startPick}/>`:html`<div><h1>Sequences <button class="btn" onClick=${addSeq}>+ New</button></h1>${pick&&pick.mode==='an'&&html`<div class="card"><p class="lbl">Selecting for Analyze: ${TT[pick.sec]}</p><div class="hint">Tap sequences to select. Their elements are included.</div></div>`}${D.seqs.length?D.seqs.map(s=>html`<${SeqCard} key=${s.id} s=${s} D=${D} go=${go} pk=${pick&&pick.mode==='an'?pick:null} tg=${tg}/>`):html`<div class="empty">No sequences</div>`}</div>`;
 else if(t==='proc')body=pr?html`<${ProcDetail} p=${pr} D=${D} setP=${setP} setS=${setS} go=${go} delP=${delP}/>`:html`<div><h1>Processes <button class="btn" onClick=${addP}>+ New</button></h1>${ppk&&html`<div class="card"><p class="lbl">Adding processes to ${pPort?pPort.name:'portfolio'}</p><div class="hint">Tap processes to select.</div></div>`}${D.procs.map(p=>html`<div key=${p.id} class=${'card tap'+(ppk&&ppk.sel.includes(p.id)?' sel':'')} style=${ppk&&inP(p.id)?{opacity:.5}:null} onClick=${()=>ppk?(!inP(p.id)&&tg(p.id)):go('proc',p.id)}>${ppk&&html`<div class="hint" style=${{marginBottom:4,fontWeight:700,color:ppk.sel.includes(p.id)?'var(--accent)':'var(--ph)'}}>${inP(p.id)?'IN PORTFOLIO':ppk.sel.includes(p.id)?'☑ SELECTED':'☐ TAP TO SELECT'}</div>`}<b>${p.name}</b><div class="hint">${p.id} · ${p.dept||'—'} · ${p.product||'—'}</div><div class="hint">${D.seqs.filter(s=>s.processId===p.id).length} sequences · ${p.ops||0} operators</div></div>`)}${!D.procs.length&&html`<div class="empty">No processes</div>`}</div>`;
 else if(t==='port')body=pt?html`<${PortDetail} P=${pt} D=${D} setP=${setPo} go=${go} startPort=${startPort} dup=${dupPort} del=${delPort}/>`:html`<${Ports} D=${D} go=${go} add=${addPort}/>`;
 else if(t==='vsm')body=D.vsms.find(x=>x.id===id)?html`<${VsmDetail} key=${id} V=${D.vsms.find(x=>x.id===id)} D=${D} setVf=${setVf} go=${go} del=${delVsm} putV=${putV}/>`:html`<${Vsms} D=${D} go=${go} add=${addVsm}/>`;
 else if(t==='xchg')body=html`<${Exchange} D=${D} setD=${setD} go=${go}/>`;
 else if(t==='an')body=html`<${Analyze} D=${D} go=${go} an=${an} start=${startAn} clear=${clearAn}/>`;
 else body=html`<${Settings} D=${D} setD=${setD} theme=${D.theme} go=${go}/>`;
 const tabs=[['home','Home','⌂'],['el','Elements','▤'],['lib','Library','◫'],['seq','Sequences','☰'],['proc','Processes','▣'],['port','Portfolio','◈'],['vsm','VSM','⇄'],['an','Analyze','▥'],['set','Settings','⚙']];
 const pm=pick&&pick.mode;const pickBar=pick&&!(t==='seq'&&id)&&!(pm==='an'&&t==='an')&&!(pm==='port'&&t==='port')?html`<div class="pickbar"><div class="in"><b>${pick.sel.length} selected</b><span><button class="btn o" onClick=${cancelPick}>Cancel</button><button class="btn" onClick=${pm==='an'?doneAn:pm==='port'?donePort:donePick}>${pm==='an'?'Apply to Analyze':pm==='port'?'Add to portfolio':'Add to sequence'}</button></span></div></div>`:null;
 return html`<div><div style=${pick?{paddingBottom:70}:null}>${body}</div>${pickBar}${cardOpen&&html`<${MostCard} onClose=${()=>setCardOpen(false)}/>`}<nav>${tabs.map(([k,l,ic])=>html`<button key=${k} class=${at===k?'on':''} onClick=${()=>go(k)}><span class="ic">${ic}</span>${l}</button>`)}</nav></div>`}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
